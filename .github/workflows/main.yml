name: Build and verify Z-OS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang lld qemu-system-x86 python3

      - name: Build kernel and images
        run: python3 tools/build.py

      - name: Run automated verification
        run: python3 tools/verify.py all --skip-build

      - name: Upload boot image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: z-os-build
          path: |
            build/z-os.img
            build/z-os-test.img
            build/z-os.elf
            build/user_init.elf
            build/manifest.json
            build/selftest.log
            build/smoke.log
